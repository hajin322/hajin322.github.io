# ---------------------------------------------------------------------------
# Site
# ---------------------------------------------------------------------------
title: Sangjin Kim
tagline: Student Researcher · SIAI Lab
description: >
  Personal website of Sangjin Kim, a student researcher at Chung-Ang
  University working on bandit theory and sequential decision-making.
url: https://hajin322.github.io
baseurl: ""

author:
  name: Sangjin Kim
  email: daramg0314@cau.ac.kr
  github: hajin322
  scholar: ""
  orcid: https://orcid.org/0009-0004-1100-7475
  affiliation: Chung-Ang University · SIAI Lab
  advisor: Prof. Wonyoung Kim

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
markdown: kramdown
highlighter: rouge
timezone: Asia/Seoul

kramdown:
  math_engine: null
  syntax_highlighter: rouge

sass:
  style: compressed

# ---------------------------------------------------------------------------
# Plugins
# ---------------------------------------------------------------------------
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope: { path: "" }
    values: { layout: page }

# ---------------------------------------------------------------------------
# Excludes
# ---------------------------------------------------------------------------
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - node_modules
  - .github
  - _to_delete
