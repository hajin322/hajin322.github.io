<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">

{% seo %}

<!-- Titles: Source Serif 4 (Latin) + Noto Serif KR (Hangul, modern myeongjo).
     Body: system sans, with Noto Sans KR as the Hangul fallback for platforms
     that have no good one of their own. Neither Hangul webfont is downloaded
     when the OS supplies a face earlier in the stack (e.g. macOS). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,600&amp;family=Noto+Serif+KR:wght@400;500;600;700&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

<!-- Apply the saved language before first paint (no flash of the wrong text) -->
<script>
  (function () {
    try {
      var saved = localStorage.getItem('site-lang');
      if (saved === 'ko' || saved === 'en') document.documentElement.lang = saved;
    } catch (e) {}
  })();
</script>
